{% extends "base.html" %}

{% block content %}
<div class="card">
    <h2>{% if student %}Edit Student{% else %}Add Student{% endif %}</h2>

    <form method="POST"
          action="{% if student %}{{ url_for('update_student', id=student.id) }}{% else %}{{ url_for('create_student') }}{% endif %}">

        {% if student %}
            <input type="hidden" name="_method" value="PUT">
        {% endif %}

        <div class="form-group">
            <label>Name:</label><br>
            <input type="text" name="name"
                   value="{{ student.name if student else '' }}" required>
        </div>

        <div class="form-group">
            <label>Email:</label><br>
            <input type="email" name="email"
                   value="{{ student.email if student else '' }}" required>
        </div>

        <button type="submit">Save</button>
    </form>
</div>
{% endblock %}
